# sdr-admin — nginx server config (staging)
#
# Routes /onboard/<token> and /agenda/<token> to the PHP-FPM front controller.
# Replace $SERVER_NAME and the PHP-FPM socket/port to match the host.

server {
    listen 80;
    server_name $SERVER_NAME;

    root /var/www/html;
    index index.php;

    # static assets
    location ~* \.(ico|png|jpg|jpeg|webp|css|js)$ {
        expires 7d;
        try_files $uri =404;
    }

    # front controller for the two admin routes
    location ~ ^/(onboard|agenda) {
        if (-f $request_filename) {
            break;
        }
        rewrite ^ /index.php last;
    }

    # PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }
}