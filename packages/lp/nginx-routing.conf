# =============================================================================
# Nginx routing for /blog and /artists
# =============================================================================
#
# Paste this into Coolify's Custom Nginx Config UI.
#
# IMPORTANT — ordering matters:
#   These location blocks MUST come BEFORE the catch-all `location ~ \.php$`
#   block so they take priority over PHP-FPM handling.  If Coolify appends
#   custom config after its generated config you may need to override the
#   entire server block instead.
#
# VERIFY after pasting:
#   1. `curl -I https://vaif.com.br/blog` returns HTTP 200 (not 404)
#   2. `curl -I https://vaif.com.br/blog/some-post` returns HTTP 200
#   3. `curl -I https://vaif.com.br/artists/artist-slug` returns HTTP 200
#   4. Existing pages (/, /calculadora/, /onboard/*, /api/*) still work
#
# If PHP files inside /blog or /artists are being downloaded instead of
# executed, the location blocks are being hit AFTER `location ~ \.php$`.
# Move them above that block in Coolify UI.
#
# =============================================================================

# /blog — clean URLs for the blog front-controller
location /blog {
    try_files $uri $uri/ /blog/index.php?$args;
}

# /artists — clean URLs for the artists front-controller
location /artists {
    try_files $uri $uri/ /artists/index.php?$args;
}
