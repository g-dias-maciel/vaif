# =============================================================================
# VAIF LP — Nginx server block
#
# Single PHP application rooted at /app (document root).
#
# Clean-URL routing for the front-controllers:
#   /blog    -> blog/index.php
#   /artists -> artists/index.php
#   /onboard -> onboard/index.php
#
# All .php requests are dispatched to PHP-FPM (127.0.0.1:9000).
# Static assets (css/js/img) are served directly.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /app;
    index index.php;

    # Optional: request size for lead submissions
    client_max_body_size 4M;

    # --- Static assets: serve directly ---
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|eot|map|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- Front-controller: /blog ---
    # Any request under /blog that is not a real static file is dispatched to
    # blog/index.php through PHP-FPM. `rewrite ... break` prevents nginx from
    # re-entering location matching (which would otherwise serve the PHP file
    # as a static download).
    location ^~ /blog {
        if (-f $request_filename) {
            break;
        }
        rewrite ^ /blog/index.php break;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/blog/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # --- Front-controller: /artists ---
    location ^~ /artists {
        if (-f $request_filename) {
            break;
        }
        rewrite ^ /artists/index.php break;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/artists/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # --- Front-controller: /onboard ---
    location ^~ /onboard {
        if (-f $request_filename) {
            break;
        }
        rewrite ^ /onboard/index.php break;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/onboard/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # --- PHP: dispatch everything else ---
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # --- Root / fallback to index.php ---
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- Deny hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
