# =============================================================================
# VAIF LP — Nginx server block
#
# Single PHP application rooted at /app (document root).
#
# Clean-URL routing for the front-controllers:
#   /blog    -> blog/index.php
#   /artists -> artists/index.php
#   /onboard -> onboard/index.php
#   /agenda  -> agenda/index.php
#
# All .php requests are dispatched to PHP-FPM (127.0.0.1:9000).
# Static assets (css/js/img) are served directly.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /app;
    index index.php;

    # Optional: request size for lead submissions
    client_max_body_size 4M;

    # --- Static assets: serve directly ---
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|eot|map|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- Front-controllers ---
    # try_files serves any real file (css/js/img/media, regardless of extension)
    # directly from disk and routes everything else to the controller's
    # index.php through the named location below.
    #
    # NB: do NOT go back to `if (-f $request_filename) { break; }` inside these
    # blocks. `break` only stops the rewrite phase — the request still falls
    # through to the block's fastcgi_pass, so every existing asset under a
    # controller prefix (e.g. /artists/artist.css and the per-artist media) is
    # handed to PHP and 404s.
    location ^~ /blog {
        try_files $uri @blog;
    }
    location @blog {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/blog/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /artists {
        try_files $uri @artists;
    }
    location @artists {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/artists/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /onboard {
        try_files $uri @onboard;
    }
    location @onboard {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/onboard/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ^~ /agenda {
        try_files $uri @agenda;
    }
    location @agenda {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/agenda/index.php;
        fastcgi_pass 127.0.0.1:9000;
    }

    # --- PHP: dispatch everything else ---
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # --- Root / fallback to index.php ---
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- Deny hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
