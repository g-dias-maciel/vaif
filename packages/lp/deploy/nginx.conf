# =============================================================================
# VAIF LP — Nginx server block
#
# Single PHP application rooted at /app (document root).
#
# Clean-URL routing for the front-controllers:
#   /calculadora -> calculadora.php
#   /blog        -> blog/index.php
#   /artists     -> artists/index.php
#   /onboard     -> onboard/index.php
#   /agenda      -> agenda/index.php
#   /novo-artista   -> novo-artista/index.php
#   /artistas-admin -> artistas-admin/index.php
#
# SECURITY: never use `^~` on the front-controller prefixes. `^~` skips regex
# locations, so `try_files $uri` would serve application PHP files as plain
# source (e.g. /artists/index.php or /artists/config/foo.php). Plain prefix
# locations let the regex blocks below win.
# =============================================================================

# Rate limits (this file is included inside the `http` block).
limit_req_zone $binary_remote_addr zone=lp_api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=lp_portal:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=lp_admin:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /app;
    index index.php;
    server_tokens off;
    fastcgi_hide_header X-Powered-By;

    # Optional: request size — raised so artist photo uploads fit (up to 15 MB
    # per image, several images per form).
    client_max_body_size 25M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Static assets: serve directly ---
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|otf|eot|map|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # --- Application internals: never served ---
    # Libraries, partials, migrations and test code are not public. This also
    # blocks direct execution of partials that expect their parent's scope.
    location ~* ^/(lib|tests|migrations|components|content|artists/(config|sections))/ {
        deny all;
    }

    # --- API endpoints (rate limited) ---
    location ^~ /api/ {
        limit_req zone=lp_api burst=10 nodelay;
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    # --- /calculadora — clean URL for the calculator page (canonical: /calculadora/) ---
    location = /calculadora {
        try_files $uri @calculadora;
    }
    location /calculadora/ {
        try_files $uri @calculadora;
    }
    location @calculadora {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/calculadora.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    # --- Front-controllers ---
    # try_files serves any real file (css/js/img/media, regardless of extension)
    # directly from disk and routes everything else to the controller's
    # index.php through the named location below.
    #
    # `location /artists/index.php` still matches the regex `.php$` block below
    # (plain prefixes are overridden by regex locations), so PHP is executed —
    # never downloaded.
    location /blog {
        limit_req zone=lp_portal burst=20 nodelay;
        try_files $uri @blog;
    }
    location @blog {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/blog/index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    location /artists {
        try_files $uri @artists;
    }
    location @artists {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/artists/index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    location /onboard {
        limit_req zone=lp_portal burst=20 nodelay;
        try_files $uri @onboard;
    }
    location @onboard {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/onboard/index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    location /agenda {
        limit_req zone=lp_portal burst=20 nodelay;
        try_files $uri @agenda;
    }
    location @agenda {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/agenda/index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    location /novo-artista {
        limit_req zone=lp_portal burst=20 nodelay;
        try_files $uri @novo_artista;
    }
    location @novo_artista {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/novo-artista/index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    location /artistas-admin {
        limit_req zone=lp_admin burst=5 nodelay;
        try_files $uri @artistas_admin;
    }
    location @artistas_admin {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/artistas-admin/index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    # --- PHP: dispatch everything else ---
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 60s;
    }

    # --- Root / fallback to index.php ---
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- Deny hidden files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
