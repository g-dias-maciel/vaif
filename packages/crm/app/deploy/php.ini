; Production PHP settings (loaded after the image defaults).
;
; The CRM has no upload endpoints today; the limits are headroom for future
; reference-picture uploads, matching the LP's 12M ceiling.

memory_limit = 256M
upload_max_filesize = 12M
post_max_size = 12M
max_execution_time = 60
expose_php = Off

; Container images are immutable: never stat files on each request.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
