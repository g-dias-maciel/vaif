; Overrides the image defaults (loaded last: zz-vaif.conf).
;
; clear_env = no is essential: Coolify injects APP_KEY, DB_*, WAHA_* as
; container environment variables, and PHP-FPM drops them before workers start
; unless clear_env is disabled. Without it Laravel sees an empty environment and
; every request 500s with "No application encryption key".

[www]
listen = 127.0.0.1:9000
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
