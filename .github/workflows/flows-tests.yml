name: Flows tests

on:
  push:
    paths:
      - "packages/flows/**"
      - "packages/crm/db/migrations/**"
      - ".github/workflows/flows-tests.yml"
  pull_request:
    paths:
      - "packages/flows/**"
      - "packages/crm/db/migrations/**"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # All of these are offline: no DB, n8n, WAHA or model calls.
      - name: Prompt + workflow wiring
        run: python3 packages/flows/tests/test_system_prompt.py

      - name: Price gate truth table
        run: node packages/flows/definitions/code/test-price-gate.js

      - name: Debounce media across the burst
        run: node packages/flows/definitions/code/test-debounce-media.js

      - name: Doubt checkpoint (rhetorical questions + burst answers)
        run: node packages/flows/definitions/code/test-doubt-checkpoint.js

      - name: Tattoo type only from the lead
        run: node packages/flows/definitions/code/test-tattoo-type.js

      - name: Placement extraction and price lookup
        run: node packages/flows/definitions/code/test-placement.js

      - name: Negotiated discounts on later turns
        run: node packages/flows/definitions/code/test-negotiation.js

      - name: Reference image vision analysis
        run: node packages/flows/definitions/code/test-vision.js

      - name: Per-artist blocked numbers
        run: node packages/flows/definitions/code/test-blocked-number.js

      - name: Availability truth and reschedule guards
        run: node packages/flows/definitions/code/test-availability-guard.js

      - name: Grounded-reply validator
        run: node packages/flows/definitions/code/test-validator.js

      - name: Price grounding (enforce)
        run: node packages/flows/definitions/code/test-price-grounding.js

      - name: Availability grounding (enforce)
        run: node packages/flows/definitions/code/test-availability-grounding.js

      - name: Conditions and promises (enforce)
        run: node packages/flows/definitions/code/test-conditions-grounding.js

      - name: Video and portfolio context (enforce)
        run: node packages/flows/definitions/code/test-context-grounding.js

      - name: Repair-once loop
        run: node packages/flows/definitions/code/test-repair-loop.js

      - name: Conversation suite (units + scenarios)
        run: node packages/flows/tests/conversation/run.js
