<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta 05: Split Rehearsal (Chat WhatsApp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D4B04C; --gold-light:#E5C35E;
    --bg:#0A0A0A; --card:#121212; --input:#1A1A1A;
    --text:rgb(242,237,228); --muted:#CCCCCC; --muted2:#8a867e;
    --border:#222222; --red:#D44C4C; --green:#4CD4A0;
    --gold-10:rgba(212,176,76,0.10); --gold-25:rgba(212,176,76,0.25);
    --wa-in:#1E2A23; --wa-out:#2A2318;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; line-height:1.6; overflow:hidden;
    background-image:radial-gradient(circle at 50% -10%, rgba(212,176,76,0.06), transparent 45%);}

  .stage{height:100vh; display:grid; grid-template-columns:1.1fr .9fr; align-items:center; gap:6vw; padding:8vh 7vw}

  .slide{grid-column:1/-1; grid-row:1; display:contents}
  .slide>.copy, .slide>.phone{opacity:0; visibility:hidden; transform:translateY(16px); transition:.5s ease, visibility 0s .5s}
  .slide.active>.copy{opacity:1;visibility:visible;transform:none;transition:.5s ease}
  .slide.active>.phone{opacity:1;visibility:visible;transform:none;transition:.5s ease .12s}

  .eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .eyebrow::before{content:'';width:26px;height:1px;background:var(--gold-25)}
  .h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(2.2rem,4.4vw,3.8rem);line-height:1.07;margin-bottom:12px}
  .h1 em{font-style:italic;color:var(--gold)}
  .time{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);display:block;margin-bottom:26px}
  .dek{color:var(--muted);font-size:1.1rem;max-width:52ch;font-weight:300;margin-bottom:30px}
  .pts{display:grid;gap:10px}
  .pt{display:flex;gap:14px;align-items:center}
  .pt .d{font-family:'Cormorant Garamond',serif;color:var(--gold);font-size:1.3rem;min-width:26px;font-weight:600}
  .pt span{font-size:.95rem}
  .note{margin-top:26px; border-left:2px solid var(--red); padding:16px 20px; background:var(--card); border-top:1px solid var(--border); border-right:1px solid var(--border); border-bottom:1px solid var(--border)}
  .note.good{border-left-color:var(--green)}
  .note .tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:700;display:block;margin-bottom:6px}
  .note.warn .tag{color:var(--red)} .note.good .tag{color:var(--green)}
  .note p{font-size:.92rem;color:var(--muted)}

  /* ── Phone mockup ── */
  .phone-wrap{justify-self:center}
  .phone{width:min(360px,86vw); background:#0C0C0C; border:1px solid var(--border); border-radius:18px; overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.7), 0 8px 30px rgba(0,0,0,.5); display:flex; flex-direction:column; height:min(680px,78vh)}
  .ph-head{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); background:var(--card)}
  .ph-ava{width:34px;height:34px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;flex:0 0 34px;transform:rotate(45deg)}
  .ph-ava::after{content:'';width:10px;height:10px;background:var(--gold)}
  .ph-name{font-size:.9rem;font-weight:600}
  .ph-status{font-size:10px;color:var(--gold);letter-spacing:1px;text-transform:uppercase}
  .ph-body{flex:1; overflow-y:auto; padding:18px 14px; display:flex; flex-direction:column; gap:10px; background:var(--bg)}
  .ph-body::-webkit-scrollbar{width:4px} .ph-body::-webkit-scrollbar-thumb{background:var(--border)}
  .msg{max-width:80%; padding:10px 14px; font-size:.9rem; line-height:1.5; border-radius:10px; position:relative}
  .msg.me{align-self:flex-end; background:var(--wa-out); border:1px solid var(--gold-25); border-bottom-right-radius:2px}
  .msg.them{align-self:flex-start; background:var(--wa-in); border:1px solid var(--border); border-bottom-left-radius:2px}
  .msg .time{display:block; font-size:9px; letter-spacing:1px; color:var(--muted2); margin-top:4px; text-align:right}
  .msg.bad{align-self:flex-end; background:var(--card); border:1px solid var(--red); color:var(--muted); text-decoration:line-through}
  .msg.bad .badge{position:absolute; top:-9px; right:-9px; width:20px;height:20px;background:var(--red);color:#000;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border-radius:50%}
  .msg.audio{display:flex;align-items:center;gap:10px; min-width:170px}
  .msg.audio .wave{flex:1;height:20px;display:flex;align-items:center;gap:2px}
  .msg.audio .wave i{flex:1;background:var(--gold);height:4px}
  .msg.audio .wave i:nth-child(2){height:10px}.msg.audio .wave i:nth-child(3){height:16px}.msg.audio .wave i:nth-child(4){height:8px}.msg.audio .wave i:nth-child(5){height:12px}
  .typing{align-self:flex-start; background:var(--wa-in); border:1px solid var(--border); border-radius:10px; padding:10px 14px; display:flex; gap:4px}
  .typing i{width:6px;height:6px;background:var(--muted2);border-radius:50%;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .ph-input{display:flex;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--border);background:var(--card)}
  .ph-input .bar{flex:1;height:38px;background:var(--input);border:1px solid var(--border);border-radius:19px;display:flex;align-items:center;padding:0 14px;color:var(--muted2);font-size:.85rem}
  .ph-input .send{width:38px;height:38px;border-radius:50%;background:var(--gold);flex:0 0 38px;display:flex;align-items:center;justify-content:center;color:#000}

  /* chrome */
  .chrome{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:22px;padding:20px 40px;background:linear-gradient(0deg,rgba(10,10,10,.92),transparent)}
  .brand{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);font-weight:600;white-space:nowrap}
  .brand .diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
  .count{font-size:11px;letter-spacing:2px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{flex:1;height:2px;background:var(--border);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--gold);width:0%;transition:width .5s}
  .nav{display:flex;gap:10px}
  .nav button{width:44px;height:44px;background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:16px;transition:.3s;display:flex;align-items:center;justify-content:center}
  .nav button:hover{border-color:var(--gold);color:var(--gold)}

  @media (max-width:820px){
    body{overflow:hidden}
    .stage{grid-template-columns:1fr; padding:8vh 6vw; align-items:start; overflow-y:auto}
    .phone{height:min(440px,50vh); width:min(320px,92vw)}
    .slide{display:block}
    .slide.active>.phone{transform:none}
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<div class="chrome">
  <div class="brand"><span class="diamond"></span>VAIF · Aula</div>
  <div class="count" id="count">01 / 11</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="nav"><button onclick="go(-1)">←</button><button onclick="go(1)">→</button></div>
</div>

<script>
const SLIDES = [
  {t:'title', title:'Como vender tatuagem no mais alto nível <em>pelo WhatsApp</em>',
   time:'Roteiro completo · do primeiro “oi” ao fechamento',
   dek:'A esquerda, o conceito. A direita, o roteiro rodando numa conversa real. Cada módulo é uma etapa do atendimento.',
   pts:['Velocidade de resposta é venda','Perguntas antes da referência','Desejo antes do preço','Fechar ou negociar'],
   chat:[['them','Oi, vi seu trabalho no Instagram! 😍'],['me','Oi! Tudo bem? Aqui é o [Nome], tatuador. Vi sua mensagem agora. Com quem eu falo?'],['them','Sou a Marina!']]},
  {t:'module', title:'Início do Atendimento', time:'Módulo 1 · 2–7 min',
   pts:['Responda em até 1 minuto','Apresente-se e pergunte o nome','Chame pelo nome sempre'],
   note:{k:'warn',tag:'Erro comum',p:'Responder só “oi, pode falar” soa frio, como robô de SAC.'},
   chat:[['them','Oi, vi seu trabalho no Instagram! 😍'],['me','Oi! Tudo bem? Aqui é o [Nome], tatuador. Vi sua mensagem agora, que bom que você chegou até mim! Com quem eu falo?'],['them','Sou a Marina!'],['me','Marina, que prazer! Me conta: é sua primeira tatuagem?']]},
  {t:'module', title:'Entender o Cliente', time:'Módulo 2 · 7–14 min',
   pts:['Primeira tatuagem?','Onde vai ser feita?','Tamanho?','Referência (quase no fim)','Significado ou estética?'],
   note:{k:'good',tag:'A ordem importa',p:'Referência cedo demais vira a conversa só sobre imagem.'},
   chat:[['me','Marina, é sua primeira tatuagem ou você já tem outras?'],['them','Já tenho duas!'],['me','Legal! E já pensou em qual parte do corpo?'],['them','Na costela'],['me','Perfeito. Mais ou menos que tamanho você imagina?'],['them','Médio, uns 10cm'],['me','Você já tem referência, ou veio só com a ideia?'],['them','Tenho umas imagens salvas'],['me','E essa tattoo tem algum significado especial pra você?']]},
  {t:'module', title:'Gerar Valor', time:'Módulo 3 · 14–20 min',
   pts:['Desejo antes do preço','Elogie a referência','É sua especialidade','Projete o resultado'],
   note:{k:'good',tag:'Guarde essa frase',p:'“Tenho certeza de que você vai amar.”'},
   chat:[['them','*enviou uma referência*'],['me','Cara, que referência boa! Esse estilo é exatamente o que eu mais gosto de fazer. Trabalho muito com isso.'],['me','Tenho certeza de que você vai amar o resultado final.']]},
  {t:'module', title:'Explicar o Processo', time:'Módulo 4 · 20–26 min',
   pts:['Processo criativo claro','Arte construída junto','100% de aprovação antes da agulha','Encaixe perfeito no corpo'],
   note:{k:'good',tag:'Justifica o preço',p:'Você vende um processo, não uma hora de agulha.'},
   chat:[['me','Deixa eu te explicar rapidinho. Eu crio a arte com base no que você me passou, e você só vai pra cadeira depois de aprovar o desenho.'],['me','Só começamos quando você estiver 100% satisfeita com a arte.']]},
  {t:'module', title:'Eliminar Dúvidas', time:'Módulo 5 · 26–29 min',
   pts:['Feche as portas de dúvida','Antes de falar de dinheiro','Ponte natural ao orçamento'],
   note:{k:'good',tag:'Por que funciona',p:'Fecha o assunto e abre o caminho pro orçamento.'},
   chat:[['me','Antes de te passar os valores, ficou alguma dúvida sobre como funciona o meu processo?'],['them','Não, entendi tudo!']]},
  {t:'module', title:'Apresentar o Orçamento', time:'Módulo 6 · 29–36 min',
   pts:['Nunca envie o preço antes dessa etapa','Valor à vista + parcelado até 6x','“Como fica pra você?”','E então: silêncio'],
   note:{k:'warn',tag:'Regra de ouro',p:'Quem fala primeiro depois do preço perde força.'},
   chat:[['me','Então, Marina, pelo que você me passou, o valor à vista fica R$ 1.800. Também dá pra parcelar em até 6x. Como fica pra você?'],['typing']]},
  {t:'module', title:'Se o Cliente Fechar', time:'Módulo 7 · 36–40 min',
   pts:['Solicite o sinal','Sinal descontado do total','Agende data + horário','Endereço + agradecimento'],
   note:{k:'good',tag:'Não acabou ainda',p:'Fechou? Agora garanta o compromisso.'},
   chat:[['them','Fechado! 😍'],['me','Perfeito! Pra garantir sua vaga, peço um sinal de R$ 300, descontado do total. Qual data funciona melhor pra você?'],['them','Pode ser dia 20, às 14h!']]},
  {t:'module', title:'Se o Cliente Não Fechar', time:'Módulo 8 · 40–47 min',
   pts:['Descubra o motivo','“Quanto imaginava investir?”','Negocie só se necessário','Desconto = contrapartida'],
   note:{k:'good',tag:'A estrutura',p:'Elogio + justificativa + desconto + contrapartida.'},
   chat:[['them','Ai, ficou um pouco acima do que eu imaginava...'],['me','Entendi, Marina! E qual valor você imaginava investir?'],['them','Uns R$ 1.400...'],['me','Olha, por esse valor eu não consigo, pela minha margem e estrutura. Mas se você fechar ainda hoje, consigo fazer por R$ 1.500. Como fica pra você?']]},
  {t:'module', title:'O Que Evitar', time:'Módulo 9 · 47–51 min',
   pts:['Preço antes da hora','Insegurança: “talvez”, “depende”','Texto gigante quando áudio resolve','Deixar esperando sem retorno'],
   note:{k:'warn',tag:'Atenção',p:'Palavras de insegurança plantam dúvida.'},
   chat:[['me','oi, pode falar',true],['me','então... talvez dê pra fazer, depende, quem sabe',true],['them','?']]},
  {t:'module', title:'Boas Práticas', time:'Módulo 10 · 51–55 min',
   pts:['Priorize áudio','Entusiasmo de verdade','Chame pelo nome','Conduza até uma decisão'],
   note:{k:'good',tag:'Do início ao fim',p:'Todo atendimento termina em uma decisão. Não deixe a conversa morrer no vazio.'},
   chat:[['me','Marina, você vai amar o resultado!',false,'audio'],['them','😍 ansiosa pra ver!'],['me','Marina, então fechamos? Te passo o endereço certinho aqui.']]},
  {t:'checklist', title:'Checklist Final', time:'Encerramento · 55–60 min',
   pts:['Entendi o desejo?','Expliquei o processo?','Tirei as dúvidas?','Orçamento correto?','Pergunta de fechamento?','Negociei?','Próxima ação combinada?'],
   note:{k:'good',tag:'Não é sorte, é processo',p:'Seguindo o roteiro, todo “oi” vira uma venda conduzida.'},
   chat:[['me','Então, Marina, fechamos pra dia 20 às 14h. Te espero! Muito obrigado pela confiança, vai ficar incrível!'],['them','Combinado! 😍']]}
];

const stage=document.getElementById('stage');
function renderSlide(s){
  const sec=document.createElement('section');sec.className='slide';
  const copy=document.createElement('div');copy.className='copy';
  const eb=document.createElement('div');eb.className='eyebrow';eb.textContent='VAIF · Aula para tatuadores';copy.appendChild(eb);
  const h=document.createElement('h1');h.className='h1';h.innerHTML=s.title;copy.appendChild(h);
  const tm=document.createElement('span');tm.className='time';tm.textContent=s.time;copy.appendChild(tm);
  if(s.dek){const d=document.createElement('p');d.className='dek';d.textContent=s.dek;copy.appendChild(d);}
  const pts=document.createElement('div');pts.className='pts';
  s.pts.forEach((p,i)=>pts.appendChild((function(){const d=document.createElement('div');d.className='pt';d.innerHTML='<span class="d">'+(s.t==='checklist'?'<span style="width:16px;height:16px;border:1px solid var(--gold);display:inline-block;position:relative;top:2px"></span>':String(i+1).padStart(2,'0'))+'</span><span>'+p+'</span>';return d;})()));
  copy.appendChild(pts);
  if(s.note){const n=document.createElement('div');n.className='note '+s.note.k;n.innerHTML='<span class="tag">'+s.note.tag+'</span><p>'+s.note.p+'</p>';copy.appendChild(n);}
  sec.appendChild(copy);

  const wrap=document.createElement('div');wrap.className='phone-wrap';
  const phone=document.createElement('div');phone.className='phone';
  phone.innerHTML='<div class="ph-head"><div class="ph-ava"></div><div><div class="ph-name">'+(s.t==='title'?'Novo lead':'Marina')+'</div><div class="ph-status">online</div></div></div>';
  const body=document.createElement('div');body.className='ph-body';
  s.chat.forEach(m=>{
    if(m==='typing'){body.appendChild((function(){const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';return t;})());return;}
    const who=m[0], txt=m[1], bad=m[2], audio=m[3];
    const d=document.createElement('div');d.className='msg '+who+(bad?' bad':''); if(audio)d.classList.add('audio');
    if(audio){d.innerHTML='<div class="wave"><i></i><i></i><i></i><i></i><i></i></div><span class="time">0:42</span>';}
    else{ d.innerHTML=(bad?'<span class="badge">✕</span>':'')+txt+'<span class="time">'+timeFor(who)+'</span>'; }
    body.appendChild(d);
  });
  phone.appendChild(body);
  phone.insertAdjacentHTML('beforeend','<div class="ph-input"><div class="bar">Mensagem</div><div class="send">➤</div></div>');
  wrap.appendChild(phone);sec.appendChild(wrap);
  stage.appendChild(sec);return sec;
}
const times={me:['14:02','14:05','14:11','14:20','14:31','14:40'],them:['14:03','14:06','14:12','14:21','14:32','14:41']};
function timeFor(who){const a=times[who];return a[Math.floor(Math.random()*a.length)];}
SLIDES.forEach(s=>stage.appendChild(renderSlide(s)));
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function go(n){i=Math.max(0,Math.min(slides.length-1,n));update();}
function update(){
  slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));
  document.getElementById('bar').style.width=((i)/(slides.length-1)*100)+'%';
  document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
}
document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key))go(i+1);
  if(['ArrowLeft','PageUp'].includes(e.key))go(i-1);
  if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);
});
update();
</script>
</body>
</html>
