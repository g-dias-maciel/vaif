<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta 04: Studio Framework (Cards)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D4B04C; --gold-light:#E5C35E;
    --bg:#0A0A0A; --card:#121212; --input:#1A1A1A;
    --text:rgb(242,237,228); --muted:#CCCCCC; --muted2:#8a867e;
    --border:#222222; --red:#D44C4C; --green:#4CD4A0;
    --gold-10:rgba(212,176,76,0.10); --gold-25:rgba(212,176,76,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; line-height:1.6; overflow:hidden;
    background-image:radial-gradient(circle at 50% -10%, rgba(212,176,76,0.07), transparent 45%);}

  /* ── Top pipeline header ── */
  .top{position:fixed; top:0; left:0; right:0; z-index:30; padding:20px 44px 16px; display:flex; align-items:center; gap:22px; background:linear-gradient(180deg,rgba(10,10,10,.92),transparent)}
  .top .brand{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);font-weight:600;white-space:nowrap}
  .top .brand .diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
  .pipe{flex:1; display:flex; gap:6px; justify-content:center}
  .pipe .seg{flex:0 1 100%; height:3px; background:var(--border); position:relative; transition:.4s}
  .pipe .seg.done{background:var(--gold-25)}
  .pipe .seg.cur{background:var(--gold)}
  .top .title{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}

  /* ── Slide ── */
  .stage{height:100vh; padding-top:70px}
  .slide{position:absolute; inset:70px 0 84px; padding:4vh 6vw; display:flex; flex-direction:column; justify-content:center;
    opacity:0; visibility:hidden; transform:translateY(16px); transition:.5s ease, visibility 0s .5s}
  .slide.active{opacity:1;visibility:visible;transform:none;transition:.5s ease}
  .inner{width:min(1160px,100%); margin:0 auto}

  .eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .eyebrow::before{content:'';width:26px;height:1px;background:var(--gold-25)}
  .h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(2.3rem,4.6vw,3.9rem);line-height:1.06;margin-bottom:10px}
  .h1 em{font-style:italic;color:var(--gold)}
  .time{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);margin-bottom:34px;display:block}
  .dek{color:var(--muted);font-size:1.15rem;max-width:60ch;font-weight:300;margin-bottom:44px}

  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px}
  .card{position:relative; background:var(--card); border:1px solid var(--border); padding:26px 26px 24px; transition:transform .3s ease, border-color .3s ease, box-shadow .3s ease; overflow:hidden}
  .card::before{content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); opacity:0; transition:opacity .3s}
  .card:hover{transform:translateY(-4px); border-color:var(--gold-25); box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .card:hover::before{opacity:1}
  .card .num{font-family:'Cormorant Garamond',serif; font-size:2.2rem; font-weight:700; color:var(--gold); line-height:1; margin-bottom:14px; display:block}
  .card strong{display:block; font-weight:600; font-size:1.02rem; margin-bottom:8px; letter-spacing:.2px}
  .card p{font-size:.9rem; color:var(--muted)}

  /* script / warn footer */
  .foot{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:30px}
  .foot .box{border:1px solid var(--border); background:var(--card); padding:22px 26px}
  .foot .box.demo{border-left:2px solid var(--gold-25)}
  .foot .box.warn{border-left:2px solid var(--red)}
  .foot .box.good{border-left:2px solid var(--green)}
  .foot .tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:700;display:block;margin-bottom:10px}
  .foot .demo .tag{color:var(--gold)} .foot .warn .tag{color:var(--red)} .foot .good .tag{color:var(--green)}
  .foot .who{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);margin-bottom:4px}
  .foot p{font-size:.93rem;color:var(--muted)}
  .foot .q{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.1rem;color:var(--text);line-height:1.5}
  .foot .q::before{content:'“'} .foot .q::after{content:'”'}

  .checks{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:900px}
  .check{display:flex;gap:14px;align-items:center;padding:18px 22px;background:var(--card);border:1px solid var(--border)}
  .check .b{width:16px;height:16px;border:1px solid var(--gold);flex:0 0 16px;position:relative}
  .check .b::after{content:'';position:absolute;inset:3px;background:var(--gold);transform:rotate(45deg)}
  .check span{font-size:.98rem}

  .nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:22px;padding:20px 44px;background:linear-gradient(0deg,rgba(10,10,10,.92),transparent)}
  .count{font-size:11px;letter-spacing:2px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .nav button{width:46px;height:46px;background:transparent;border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:16px;transition:.3s;display:flex;align-items:center;justify-content:center}
  .nav button:hover{border-color:var(--gold);color:var(--gold)}
  .nav .next{margin-left:auto; display:inline-flex; align-items:center; gap:10px; padding:14px 26px; background:var(--gold); color:#000; border:none; font-family:'Montserrat',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:.3s}
  .nav .next:hover{background:var(--gold-light); transform:translateY(-2px); box-shadow:0 6px 25px rgba(212,176,76,.3)}

  @media (max-width:760px){
    .top{padding:14px 18px 10px; gap:12px} .top .title{display:none}
    .slide{inset:58px 0 78px; overflow-y:auto; padding:3vh 5vw}
    .cards{grid-template-columns:1fr}
    .foot{grid-template-columns:1fr}
    .checks{grid-template-columns:1fr}
    .nav{padding:12px 18px; gap:12px}
  }
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="diamond"></span>VAIF · Aula</div>
  <div class="pipe" id="pipe"></div>
  <div class="title">Como vender tatuagem pelo WhatsApp</div>
</div>

<div class="stage" id="stage"></div>

<div class="nav">
  <button onclick="go(-1)">←</button>
  <button onclick="go(1)">→</button>
  <div class="count" id="count">01 / 11</div>
  <button class="next" onclick="go(1)">Próximo &rarr;</button>
</div>

<script>
const SLIDES = [
  {t:'title', title:'Como vender tatuagem no mais alto nível <em>pelo WhatsApp</em>',
   time:'Roteiro completo · do primeiro “oi” ao fechamento',
   dek:'Cada módulo é uma etapa do atendimento. Siga a ordem para não perder uma venda. No fim, confira o checklist.'},
  {t:'module', n:1, title:'Início do Atendimento', time:'Módulo 1 · 2–7 min',
   cards:[['Velocidade é venda','Cliente manda pra mais de um tatuador. Quem responde rápido sai na frente antes do preço.'],
          ['Responda em até 1 minuto','Não conseguiu? Responda o quanto antes. O importante é não deixar esfriar.'],
          ['Apresente-se','Diga quem você é e que viu a mensagem.'],
          ['Pergunte o nome','Se não aparecer no WhatsApp, pergunte logo.']],
   demo:{who:'Você',q:'Oi! Tudo bem? Aqui é o [Nome], tatuador. Vi sua mensagem agora, que bom que você chegou até mim! Com quem eu falo?'},
   note:{k:'warn',tag:'Erro comum',p:'Responder só “oi, pode falar” soa frio, como robô de SAC. Queremos parecer humanos.'}},
  {t:'module', n:2, title:'Entender o Cliente', time:'Módulo 2 · 7–14 min',
   cards:[['É a primeira tatuagem?','Nível de familiaridade.'],
          ['Onde vai ser feita?','Local no corpo muda tudo.'],
          ['Qual o tamanho?','Define escopo e investimento.'],
          ['Já tem referência?','Quase no fim, de propósito.'],
          ['Significado ou estética?','Conecta à pessoa, não à imagem.']],
   demo:{who:'Você',q:'[Nome], é sua primeira tatuagem ou você já tem outras? E já pensou em qual parte do corpo?'},
   note:{k:'good',tag:'A ordem importa',p:'Se você pede a referência cedo demais, a conversa vira só sobre imagem e você perde o cliente como pessoa.'}},
  {t:'module', n:3, title:'Gerar Valor', time:'Módulo 3 · 14–20 min',
   cards:[['Desejo antes do preço','Cliente compra a transformação, não a tatuagem.'],
          ['Elogie a referência','Valorize o que ele trouxe.'],
          ['É sua especialidade','O estilo que você domina.'],
          ['Projete o resultado','Faça ele se imaginar com a tattoo.']],
   demo:{who:'Você',q:'Cara, que referência boa! Esse estilo é exatamente o que eu mais gosto de fazer. Tenho certeza de que você vai amar o resultado final.'},
   note:{k:'good',tag:'Guarde essa frase',p:'“Tenho certeza de que você vai amar.” Planta expectativa antes de falar de valores.'}},
  {t:'module', n:4, title:'Explicar o Processo', time:'Módulo 4 · 20–26 min',
   cards:[['Processo criativo claro','Transparência tira o medo do permanente.'],
          ['Arte construída junto','Nasce do que ele passou.'],
          ['100% de aprovação','Antes da agulha, nunca depois.'],
          ['Encaixe perfeito','No corpo dele, não genérico.']],
   demo:{who:'Você',q:'Deixa eu explicar rapidinho. Eu crio a arte com base no que você me passou, e você só vai pra cadeira depois de aprovar o desenho.'},
   note:{k:'good',tag:'Justifica o preço',p:'Você não vende uma hora de agulha. Você vende um processo.'}},
  {t:'module', n:5, title:'Eliminar Dúvidas', time:'Módulo 5 · 26–29 min',
   cards:[['Feche as portas de dúvida','Antes de falar de dinheiro.'],
          ['Dúvida vira desculpa','Na hora do preço, ela aparece.'],
          ['A ponte ao orçamento','Sem pressa de falar de preço.']],
   demo:{who:'Você',q:'Antes de te passar os valores, ficou alguma dúvida sobre como funciona o meu processo?'},
   note:{k:'good',tag:'Por que funciona',p:'Fecha o assunto anterior e abre o caminho pro orçamento.'}},
  {t:'module', n:6, title:'Apresentar o Orçamento', time:'Módulo 6 · 29–36 min',
   cards:[['Nunca antes dessa etapa','Ou compara sem entender seu valor.'],
          ['Valor à vista','Informe primeiro.'],
          ['Parcelado até 6x','Depois do à vista.'],
          ['“Como fica pra você?”','E então: silêncio.']],
   demo:{who:'Você',q:'Então, [Nome], o valor à vista fica R$ [valor]. Também dá pra parcelar em até 6x. Como fica pra você?'},
   note:{k:'warn',tag:'Regra de ouro',p:'Depois dessa pergunta, você se cala. Quem fala primeiro depois do preço perde força.'}},
  {t:'module', n:7, title:'Se o Cliente Fechar', time:'Módulo 7 · 36–40 min',
   cards:[['Solicite o sinal','Garante o compromisso.'],
          ['Sinal descontado do total','Deixe claro.'],
          ['Agende data e horário','Fechado, dia X às Y.'],
          ['Endereço + agradecimento','Encerre redondo.']],
   demo:{who:'Você',q:'Perfeito! Pra garantir sua vaga, peço um sinal de R$ [valor], descontado do total. Qual data funciona melhor pra você?'},
   note:{k:'good',tag:'Não acabou ainda',p:'Fechou? Agora é garantir o compromisso e deixar tudo redondo.'}},
  {t:'module', n:8, title:'Se o Cliente Não Fechar', time:'Módulo 8 · 40–47 min',
   cards:[['Descubra o motivo','Hesitação tem causa.'],
          ['“Quanto imaginava investir?”','Tire a adivinhação.'],
          ['Negocie só se necessário','E só naquele atendimento.'],
          ['Desconto = contrapartida','Nunca de graça.']],
   demo:{who:'Você',q:'Se fechar comigo agora, consigo fazer por R$ 1.990 em vez de R$ 2.490. Só te peço uma postagem me marcando. Topa?'},
   note:{k:'good',tag:'A estrutura',p:'Elogio + justificativa + desconto + contrapartida + pergunta.'}},
  {t:'module', n:9, title:'O Que Evitar', time:'Módulo 9 · 47–51 min',
   cards:[['Preço antes da hora','Desfaz o valor construído.'],
          ['Insegurança','“Talvez”, “pode ser”, “depende”.'],
          ['Texto gigante','Quando áudio resolveria.'],
          ['Deixar esperando','Sem retorno, sem venda.']],
   note:{k:'warn',tag:'Atenção',p:'Essas palavras plantam dúvida. Se você não tem certeza, o cliente também não vai ter.'}},
  {t:'module', n:10, title:'Boas Práticas', time:'Módulo 10 · 51–55 min',
   cards:[['Priorize áudio','Humaniza.'],
          ['Entusiasmo de verdade','Energia = confiança.'],
          ['Imagine a tattoo pronta','A transformação na mente.'],
          ['Conduza até a decisão','Nunca morra no “vou pensar”.']],
   demo:{who:'Lembrete',q:'Chame o cliente pelo nome várias vezes. Atendimento leve, natural e acolhedor.'},
   note:{k:'good',tag:'Do início ao fim',p:'Todo atendimento termina em uma decisão: fechar ou negociar. Não deixe a conversa morrer no vazio.'}},
  {t:'checklist', title:'Checklist Final', time:'Encerramento · 55–60 min',
   checks:['Entendi o que o cliente deseja?','Expliquei meu processo?','Tirei todas as dúvidas?','Apresentei o orçamento corretamente?','Fiz a pergunta de fechamento?','Negociei se necessário?','Agendei / deixei próxima ação?','Chamei pelo nome, acolhedor?']}
];

const stage=document.getElementById('stage');
const pipe=document.getElementById('pipe');
SLIDES.forEach(()=>{const d=document.createElement('div');d.className='seg';pipe.appendChild(d);});
const segs=[...document.querySelectorAll('.seg')];

function renderSlide(s){
  const sec=document.createElement('section');sec.className='slide';
  const inner=document.createElement('div');inner.className='inner';
  const eb=document.createElement('div');eb.className='eyebrow';eb.textContent='VAIF · Aula para tatuadores';inner.appendChild(eb);
  const h=document.createElement('h1');h.className='h1';h.innerHTML=s.title;inner.appendChild(h);
  const tm=document.createElement('span');tm.className='time';tm.textContent=s.time;inner.appendChild(tm);
  if(s.t==='title'){ const d=document.createElement('p');d.className='dek';d.textContent=s.dek;inner.appendChild(d); }
  else if(s.t==='module'){
    const cards=document.createElement('div');cards.className='cards';
    s.cards.forEach((c,i)=>{cards.appendChild((function(){const el=document.createElement('div');el.className='card';
      el.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><strong>'+c[0]+'</strong><p>'+c[1]+'</p>';return el;})());});
    inner.appendChild(cards);
    const foot=document.createElement('div');foot.className='foot';
    foot.innerHTML='<div class="box demo"><span class="tag">Demonstração</span><div class="who">'+(s.demo?s.demo.who:'')+'</div><p class="q">'+(s.demo?s.demo.q:'')+'</p></div>';
    if(s.note){foot.innerHTML+='<div class="box '+s.note.k+'"><span class="tag">'+s.note.tag+'</span><p>'+s.note.p+'</p></div>';}
    inner.appendChild(foot);
  } else if(s.t==='checklist'){
    const c=document.createElement('div');c.className='checks';
    s.checks.forEach(x=>{c.appendChild((function(){const d=document.createElement('div');d.className='check';d.innerHTML='<span class="b"></span><span>'+x+'</span>';return d;})());});
    inner.appendChild(c);
  }
  sec.appendChild(inner);return sec;
}
SLIDES.forEach(s=>stage.appendChild(renderSlide(s)));
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function go(n){i=Math.max(0,Math.min(slides.length-1,n));update();}
function update(){
  slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));
  segs.forEach((s,idx)=>{s.classList.toggle('done',idx<i);s.classList.toggle('cur',idx===i);});
  document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
}
document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key))go(i+1);
  if(['ArrowLeft','PageUp'].includes(e.key))go(i-1);
  if(e.key==='Home')go(0);if(e.key==='End')go(slides.length-1);
});
update();
</script>
</body>
</html>
