<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta 02: Atelier Ledger (Editorial)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D4B04C; --gold-light:#E5C35E;
    --bg:#0A0A0A; --card:#121212; --input:#1A1A1A;
    --text:rgb(242,237,228); --muted:#CCCCCC; --muted2:#8a867e;
    --border:#222222; --red:#D44C4C; --green:#4CD4A0;
    --gold-10:rgba(212,176,76,0.10); --gold-25:rgba(212,176,76,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font-family:'Montserrat',sans-serif; line-height:1.62; overflow:hidden;
    background-image:radial-gradient(circle at 15% 10%, rgba(212,176,76,0.05), transparent 40%);}
  .app{display:grid; grid-template-columns:280px 1fr; height:100vh}

  /* ── Left ledger rail ── */
  .rail{border-right:1px solid var(--border); padding:42px 34px; display:flex; flex-direction:column; background:linear-gradient(180deg,var(--card),var(--bg));}
  .rail .brand{display:flex;align-items:center;gap:10px; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted2); font-weight:600; margin-bottom:44px}
  .rail .brand .diamond{width:5px;height:5px;background:var(--gold);transform:rotate(45deg)}
  .rail .label{font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--muted2); margin-bottom:18px}
  .toc{list-style:none; flex:1; overflow-y:auto}
  .toc li{display:flex; align-items:center; gap:12px; padding:9px 12px; margin-bottom:2px; cursor:pointer; border-left:2px solid transparent; transition:.25s; font-size:.82rem; color:var(--muted)}
  .toc li .n{font-family:'Cormorant Garamond',serif; font-size:1rem; color:var(--muted2); min-width:22px}
  .toc li:hover{color:var(--text)}
  .toc li.active{color:var(--text); border-left-color:var(--gold); background:var(--gold-10)}
  .toc li.active .n{color:var(--gold)}
  .rail .foot{margin-top:22px; font-size:9px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2)}

  /* ── Stage ── */
  .stage{position:relative; overflow:hidden}
  .slide{position:absolute; inset:0; padding:7vh 7vw; display:flex; flex-direction:column; justify-content:center;
    opacity:0; visibility:hidden; transform:translateY(18px);
    transition:opacity .55s ease, transform .55s ease, visibility 0s .55s;}
  .slide.active{opacity:1; visibility:visible; transform:none; transition:opacity .55s ease, transform .55s ease}
  .ghost{position:absolute; right:-0.06em; bottom:-0.22em; font-family:'Cormorant Garamond',serif; font-weight:700;
    font-size:clamp(18rem,40vw,34rem); line-height:1; color:transparent; -webkit-text-stroke:1px var(--border); user-select:none; pointer-events:none}

  .kicker{display:flex; align-items:center; gap:16px; margin-bottom:22px}
  .kicker .rule{height:1px; width:44px; background:var(--gold-25)}
  .kicker span{font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--gold); font-weight:700}
  .h1{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:clamp(2.8rem,5.6vw,5rem); line-height:1.04; margin-bottom:30px; max-width:14ch}
  .h1 em{font-style:italic; color:var(--gold)}
  .dek{color:var(--muted); font-size:1.15rem; max-width:60ch; font-weight:300}

  .grid{display:grid; grid-template-columns:repeat(12,1fr); gap:26px; margin-top:44px}
  .col-7{grid-column:span 7}.col-5{grid-column:span 5}
  .item{display:flex; gap:18px; padding:20px 0; border-top:1px solid var(--border)}
  .item:last-child{border-bottom:1px solid var(--border)}
  .item .num{font-family:'Cormorant Garamond',serif; font-size:1.9rem; color:var(--gold); line-height:1; min-width:44px; font-weight:600}
  .item strong{display:block; font-weight:600; font-size:1rem; letter-spacing:.2px}
  .item p{font-size:.9rem; color:var(--muted); margin-top:3px}
  .side{border:1px solid var(--border); background:var(--card); padding:30px}
  .side .tag{font-size:10px; letter-spacing:3px; text-transform:uppercase; font-weight:700; margin-bottom:14px; display:block}
  .side.demo .tag{color:var(--gold)}
  .side.demo{border-left:2px solid var(--gold-25)}
  .side.warn .tag{color:var(--red)} .side.warn{border-left:2px solid var(--red)}
  .side.good .tag{color:var(--green)} .side.good{border-left:2px solid var(--green)}
  .side .who{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2); margin-bottom:6px}
  .side p{font-size:.95rem; color:var(--muted)}
  .side .quote{font-size:1.06rem; color:var(--text); line-height:1.6; font-style:italic; font-family:'Cormorant Garamond',serif}
  .side .quote::before{content:'“'} .side .quote::after{content:'”'}

  .checks{display:grid; grid-template-columns:1fr 1fr; gap:0; border-top:1px solid var(--border)}
  .checks div{display:flex; gap:14px; align-items:center; padding:18px 20px; border-bottom:1px solid var(--border); border-right:1px solid var(--border)}
  .checks div:nth-child(even){border-right:none}
  .checks .b{width:16px;height:16px;border:1px solid var(--gold);flex:0 0 16px;position:relative}
  .checks .b::after{content:'';position:absolute;inset:3px;background:var(--gold);transform:rotate(45deg)}
  .checks span{font-size:.95rem}

  @media (max-width:860px){
    .app{grid-template-columns:1fr}
    .rail{display:none}
    .grid{grid-template-columns:1fr}
    .col-7,.col-5{grid-column:span 1}
    .checks{grid-template-columns:1fr}
    .checks div{border-right:none}
    .slide{overflow-y:auto}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="diamond"></span>VAIF · Aula</div>
    <div class="label">Sumário da aula</div>
    <ul class="toc" id="toc"></ul>
    <div class="foot">Como vender tatuagem pelo WhatsApp</div>
  </aside>

  <main class="stage" id="stage"></main>
</div>

<script>
const SLIDES = [
  {t:'title', n:'00', kicker:'Videoaula · Produto Low Ticket', title:'Como vender tatuagem no mais alto nível <em>pelo WhatsApp</em>',
   dek:'Um roteiro completo e testado, do primeiro “oi” até o fechamento. No fim, um checklist para você nunca mais pular uma etapa.'},
  {t:'module', n:'01', kicker:'Módulo 1 · 2–7 min', title:'Início do Atendimento',
   points:[
     {t:'Velocidade de resposta é venda',d:'Cliente manda pra mais de um tatuador. Quem responde rápido sai na frente antes do preço.'},
     {t:'Responda em até 1 minuto',d:'Não conseguiu? Responda o quanto antes. O importante é não deixar esfriar.'},
     {t:'Apresente-se e pergunte o nome',d:'Se o nome não aparecer, pergunte logo.'},
     {t:'Chame pelo nome sempre',d:'A partir daqui, em toda mensagem.'}],
   demo:{who:'Você', text:'Oi! Tudo bem? Aqui é o [Nome], tatuador. Vi sua mensagem agora, que bom que você chegou até mim! Com quem eu falo?'},
   note:{k:'warn', tag:'Erro comum', text:'Responder só “oi, pode falar” soa frio, como robô de SAC. Queremos parecer humanos.'}},
  {t:'module', n:'02', kicker:'Módulo 2 · 7–14 min', title:'Entender o Cliente',
   points:[
     {t:'É a primeira tatuagem?',d:'Nível de familiaridade.'},
     {t:'Onde vai ser feita?',d:'Local no corpo muda tudo.'},
     {t:'Qual o tamanho?',d:'Define escopo e investimento.'},
     {t:'Já tem referência?',d:'Quase no fim, de propósito.'},
     {t:'Significado ou estética?',d:'Conecta à pessoa, não à imagem.'}],
   demo:{who:'Você', text:'[Nome], é sua primeira tatuagem ou você já tem outras? E já pensou em qual parte do corpo?'},
   note:{k:'good', tag:'A ordem importa', text:'Se você pede a referência cedo demais, a conversa vira só sobre imagem e você perde o cliente como pessoa.'}},
  {t:'module', n:'03', kicker:'Módulo 3 · 14–20 min', title:'Gerar Valor',
   points:[
     {t:'Desejo antes do preço',d:'Cliente compra a transformação.'},
     {t:'Elogie a referência',d:'Valorize o que ele trouxe.'},
     {t:'É sua especialidade',d:'Aquele estilo é o que você domina.'},
     {t:'Projete o resultado',d:'Faça ele se imaginar com a tattoo.'}],
   demo:{who:'Você', text:'Cara, que referência boa! Esse estilo é exatamente o que eu mais gosto de fazer. Tenho certeza de que você vai amar o resultado final.'},
   note:{k:'good', tag:'Guarde essa frase', text:'“Tenho certeza de que você vai amar.” Planta expectativa antes de falar de valores.'}},
  {t:'module', n:'04', kicker:'Módulo 4 · 20–26 min', title:'Explicar o Processo',
   points:[
     {t:'Processo criativo claro',d:'Transparência tira o medo do permanente.'},
     {t:'Arte construída junto',d:'Nasce do que ele passou.'},
     {t:'100% de aprovação',d:'Antes da agulha, nunca depois.'},
     {t:'Encaixe perfeito',d:'No corpo dele, não genérico.'}],
   demo:{who:'Você', text:'Deixa eu explicar rapidinho. Eu crio a arte com base no que você me passou, e você só vai pra cadeira depois de aprovar o desenho.'},
   note:{k:'good', tag:'Justifica o preço', text:'Você não vende uma hora de agulha. Você vende um processo. Por isso seu preço não precisa ser o mais barato.'}},
  {t:'module', n:'05', kicker:'Módulo 5 · 26–29 min', title:'Eliminar Dúvidas',
   points:[
     {t:'Feche as portas de dúvida',d:'Antes de falar de dinheiro.'},
     {t:'Dúvida vira desculpa',d:'Na hora do preço, ela aparece.'},
     {t:'A ponte ao orçamento',d:'Sem pressa de falar de preço.'}],
   demo:{who:'Você', text:'Antes de te passar os valores, ficou alguma dúvida sobre como funciona o meu processo?'},
   note:{k:'good', tag:'Por que funciona', text:'Fecha o assunto anterior e abre o caminho pro orçamento de um jeito natural.'}},
  {t:'module', n:'06', kicker:'Módulo 6 · 29–36 min', title:'Apresentar o Orçamento',
   points:[
     {t:'Nunca antes dessa etapa',d:'Ou compara sem entender seu valor.'},
     {t:'Valor à vista',d:'Informe primeiro.'},
     {t:'Parcelado até 6x',d:'Depois do à vista.'},
     {t:'“Como fica pra você?”',d:'E então: silêncio.'}],
   demo:{who:'Você', text:'Então, [Nome], o valor à vista fica R$ [valor]. Também dá pra parcelar em até 6x. Como fica pra você?'},
   note:{k:'warn', tag:'Regra de ouro', text:'Depois dessa pergunta, você se cala. Quem fala primeiro depois do preço perde força.'}},
  {t:'module', n:'07', kicker:'Módulo 7 · 36–40 min', title:'Se o Cliente Fechar',
   points:[
     {t:'Solicite o sinal',d:'Garante o compromisso.'},
     {t:'Sinal descontado do total',d:'Deixe claro.'},
     {t:'Agende data e horário',d:'Fechado, dia X às Y.'},
     {t:'Endereço + agradecimento',d:'Encerre redondo.'}],
   demo:{who:'Você', text:'Perfeito! Pra garantir sua vaga, peço um sinal de R$ [valor], descontado do total. Qual data funciona melhor pra você?'},
   note:{k:'good', tag:'Não acabou ainda', text:'Fechou? Agora é garantir o compromisso e deixar tudo redondo.'}},
  {t:'module', n:'08', kicker:'Módulo 8 · 40–47 min', title:'Se o Cliente Não Fechar',
   points:[
     {t:'Descubra o motivo',d:'Hesitação tem causa.'},
     {t:'“Quanto imaginava investir?”',d:'Tire a adivinhação.'},
     {t:'Negocie só se necessário',d:'E só naquele atendimento.'},
     {t:'Desconto = contrapartida',d:'Nunca de graça.'}],
   demo:{who:'Você', text:'Se fechar comigo agora, consigo fazer por R$ 1.990 em vez de R$ 2.490. Só te peço uma postagem me marcando. Topa?'},
   note:{k:'good', tag:'A estrutura', text:'Elogio + justificativa + desconto + contrapartida + pergunta de fechamento.'}},
  {t:'module', n:'09', kicker:'Módulo 9 · 47–51 min', title:'O Que Evitar',
   points:[
     {t:'Preço antes da hora',d:'Desfaz o valor construído.'},
     {t:'Insegurança',d:'“Talvez”, “pode ser”, “depende”.'},
     {t:'Texto gigante',d:'Quando áudio resolveria.'},
     {t:'Deixar esperando',d:'Sem retorno, sem venda.'}],
   note:{k:'warn', tag:'Atenção', text:'Essas palavras plantam dúvida. Se você não tem certeza, o cliente também não vai ter.'}},
  {t:'module', n:'10', kicker:'Módulo 10 · 51–55 min', title:'Boas Práticas',
   points:[
     {t:'Priorize áudio',d:'Humaniza.'},
     {t:'Entusiasmo de verdade',d:'Energia = confiança.'},
     {t:'Imagine a tattoo pronta',d:'A transformação na mente.'},
     {t:'Conduza até a decisão',d:'Nunca morra no “vou pensar”.'}],
   demo:{who:'Lembrete', text:'Chame o cliente pelo nome várias vezes. Atendimento leve, natural e acolhedor.'},
   note:{k:'good', tag:'Do início ao fim', text:'Todo atendimento termina em uma decisão: fechar ou negociar. Não deixe a conversa morrer no vazio.'}},
  {t:'checklist', n:'11', kicker:'Encerramento · 55–60 min', title:'Checklist Final',
   checks:['Entendi o que o cliente deseja?','Expliquei meu processo?','Tirei todas as dúvidas?','Apresentei o orçamento corretamente?','Fiz a pergunta de fechamento?','Negociei se necessário?','Agendei / deixei próxima ação?','Chamei pelo nome, acolhedor?']}
];

const stage = document.getElementById('stage');
const toc = document.getElementById('toc');

function renderSlide(s){
  const sec = document.createElement('section'); sec.className='slide';
  const ghost = document.createElement('div'); ghost.className='ghost'; ghost.textContent=s.n; sec.appendChild(ghost);
  const kick = document.createElement('div'); kick.className='kicker'; kick.innerHTML='<span class="rule"></span><span>'+s.kicker+'</span>'; sec.appendChild(kick);

  if(s.t==='title'){
    const h=document.createElement('h1'); h.className='h1'; h.innerHTML=s.title; sec.appendChild(h);
    const d=document.createElement('p'); d.className='dek'; d.textContent=s.dek; sec.appendChild(d);
  } else if(s.t==='module'){
    const h=document.createElement('h1'); h.className='h1'; h.textContent=s.title; sec.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid';
    const left=document.createElement('div'); left.className='col-7';
    s.points.forEach((p,i)=>{ const it=document.createElement('div'); it.className='item';
      it.innerHTML='<div class="num">'+String(i+1).padStart(2,'0')+'</div><div><strong>'+p.t+'</strong><p>'+p.d+'</p></div>'; left.appendChild(it);});
    const right=document.createElement('div'); right.className='col-5';
    const demo=document.createElement('div'); demo.className='side demo'; demo.innerHTML='<span class="tag">Demonstração</span><div class="who">'+s.demo.who+'</div><p class="quote">'+s.demo.text+'</p>'; right.appendChild(demo);
    if(s.note){ const nt=document.createElement('div'); nt.className='side '+s.note.k; nt.style.marginTop='20px'; nt.innerHTML='<span class="tag">'+s.note.tag+'</span><p>'+s.note.text+'</p>'; right.appendChild(nt); }
    grid.appendChild(left); grid.appendChild(right); sec.appendChild(grid);
  } else if(s.t==='checklist'){
    const h=document.createElement('h1'); h.className='h1'; h.textContent=s.title; sec.appendChild(h);
    const c=document.createElement('div'); c.className='checks'; c.style.maxWidth='860px';
    s.checks.forEach(x=>{const d=document.createElement('div'); d.innerHTML='<span class="b"></span><span>'+x+'</span>'; c.appendChild(d);});
    sec.appendChild(c);
  }
  stage.appendChild(sec);
  return {sec, label:s.n, title:s.title};
}

const meta = SLIDES.map(renderSlide);
meta.forEach((m,idx)=>{ const li=document.createElement('li'); li.innerHTML='<span class="n">'+m.label+'</span><span>'+m.title+'</span>';
  li.onclick=()=>go(idx); toc.appendChild(li); });

const slides=[...document.querySelectorAll('.slide')];
const tocItems=[...document.querySelectorAll('.toc li')];
let i=0;
function go(n){ i=Math.max(0,Math.min(slides.length-1,n)); update(); }
function update(){
  slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));
  tocItems.forEach((t,idx)=>t.classList.toggle('active',idx===i));
  tocItems[i] && tocItems[i].scrollIntoView({block:'nearest', behavior:'smooth'});
}
document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key))go(i+1);
  if(['ArrowLeft','PageUp'].includes(e.key))go(i-1);
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
update();
</script>
</body>
</html>
