<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposta 01: Golden Needle (Deck Clássico)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#D4B04C; --gold-light:#E5C35E;
    --bg:#0A0A0A; --card:#121212; --input:#1A1A1A;
    --text:rgb(242,237,228); --muted:#CCCCCC; --muted2:#8a867e;
    --border:#222222; --red:#D44C4C; --green:#4CD4A0;
    --gold-10:rgba(212,176,76,0.10); --gold-25:rgba(212,176,76,0.25);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Montserrat',sans-serif; line-height:1.6;
    overflow:hidden;
    background-image:radial-gradient(circle at 80% 15%, rgba(212,176,76,0.06), transparent 45%);
  }
  .deck{position:relative;height:100vh;width:100vw}

  /* ── Slide base ── */
  .slide{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:8vh 8vw;
    opacity:0; visibility:hidden; transform:translateY(14px);
    transition:opacity .5s ease, transform .5s ease, visibility 0s .5s;
  }
  .slide.active{opacity:1; visibility:visible; transform:none; transition:opacity .5s ease, transform .5s ease}
  .inner{width:min(1080px,100%)}

  /* ── Reusable atoms ── */
  .eyebrow{
    font-size:11px; font-weight:700; letter-spacing:4px; text-transform:uppercase;
    color:var(--gold); margin-bottom:20px; display:flex; align-items:center; gap:14px;
  }
  .eyebrow::before{content:''; width:26px; height:1px; background:var(--gold-25)}
  .diamond{width:6px;height:6px;background:var(--gold);transform:rotate(45deg);display:inline-block}
  .title{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:clamp(2.6rem,5.4vw,4.6rem); line-height:1.08; margin-bottom:26px;
  }
  .title em{font-style:italic; color:var(--gold)}
  .lede{color:var(--muted); font-size:clamp(1.05rem,1.6vw,1.25rem); max-width:640px; font-weight:400}

  /* module body */
  .mod-head{display:flex; align-items:baseline; gap:20px; margin-bottom:6px}
  .mod-num{font-family:'Cormorant Garamond',serif; font-size:1.15rem; color:var(--gold); font-weight:600; letter-spacing:1px}
  .mod-time{font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2)}
  .mod-title{font-family:'Cormorant Garamond',serif; font-size:clamp(2.1rem,4vw,3.4rem); font-weight:600; line-height:1.1; margin-bottom:34px}
  .points{display:grid; gap:14px; max-width:820px}
  .point{display:flex; gap:18px; align-items:flex-start; padding:18px 22px; background:var(--card); border:1px solid var(--border); border-left:2px solid var(--gold-25)}
  .point .d{font-family:'Cormorant Garamond',serif; font-size:1.35rem; color:var(--gold); line-height:1.2; flex:0 0 34px; padding-top:2px}
  .point strong{font-weight:600; color:var(--text); display:block; font-size:.98rem; letter-spacing:.2px}
  .point span{font-size:.9rem; color:var(--muted); display:block; margin-top:2px}

  /* demo + note */
  .split{display:grid; grid-template-columns:1.15fr .85fr; gap:32px; align-items:start; margin-top:34px; max-width:900px}
  .demo{border:1px solid var(--gold-25); background:var(--gold-10); padding:24px 26px}
  .demo .tag{font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); font-weight:700; margin-bottom:12px; display:block}
  .demo .bubble{background:var(--input); border:1px solid var(--border); padding:16px 18px; font-size:.95rem; color:var(--text); line-height:1.55}
  .demo .who{font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2); margin-bottom:6px; display:block}
  .note{border:1px solid var(--border); padding:24px 26px; background:var(--card)}
  .note.warn{border-left:2px solid var(--red)}
  .note.good{border-left:2px solid var(--green)}
  .note .tag{font-size:10px; letter-spacing:3px; text-transform:uppercase; font-weight:700; margin-bottom:10px; display:block}
  .note.warn .tag{color:var(--red)} .note.good .tag{color:var(--green)}
  .note p{font-size:.92rem; color:var(--muted)}

  /* title slide extras */
  .chips{display:flex; flex-wrap:wrap; gap:12px; margin-top:40px; max-width:680px}
  .chip{border:1px solid var(--border); padding:12px 18px; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted)}
  .chip b{color:var(--gold); font-weight:700}

  /* checklist */
  .checks{display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:820px; margin-top:10px}
  .check{display:flex; gap:14px; align-items:center; padding:16px 20px; background:var(--card); border:1px solid var(--border)}
  .check .box{width:18px;height:18px;border:1px solid var(--gold);flex:0 0 18px; display:flex;align-items:center;justify-content:center}
  .check .box::after{content:''; width:8px;height:8px;background:var(--gold);transform:rotate(45deg)}
  .check span{font-size:.95rem}

  /* chrome */
  .chrome{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:center; gap:22px; padding:22px 40px; background:linear-gradient(180deg,transparent, rgba(10,10,10,.88));}
  .brand{display:flex;align-items:center;gap:10px; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted2); font-weight:600}
  .brand .diamond{width:5px;height:5px}
  .count{font-size:11px; letter-spacing:2px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap}
  .bar{flex:1; height:2px; background:var(--border); overflow:hidden}
  .bar i{display:block; height:100%; background:var(--gold); width:0%; transition:width .5s cubic-bezier(.165,.84,.44,1)}
  .nav{display:flex; gap:10px}
  .nav button{width:44px;height:44px; background:transparent; border:1px solid var(--border); color:var(--text); cursor:pointer; font-size:16px; transition:.3s; display:flex;align-items:center;justify-content:center}
  .nav button:hover{border-color:var(--gold); color:var(--gold)}
  .hint{position:fixed; top:22px; right:26px; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted2); z-index:20}

  @media (max-width:760px){
    .slide{padding:6vh 6vw; overflow-y:auto; align-items:flex-start}
    .split{grid-template-columns:1fr}
    .checks{grid-template-columns:1fr}
    .chrome{padding:14px 20px; gap:12px}
    .brand{display:none}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="hint">← → para navegar</div>
<div class="chrome">
  <div class="brand"><span class="diamond"></span>VAIF · Aula para tatuadores</div>
  <div class="count" id="count">01 / 12</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="nav">
    <button onclick="go(-1)" aria-label="Anterior">←</button>
    <button onclick="go(1)" aria-label="Próximo">→</button>
  </div>
</div>

<script>
const SLIDES = [
  {t:'title', eyebrow:'Videoaula · Produto Low Ticket', title:'Como vender tatuagem no mais alto nível <em>pelo WhatsApp</em>',
   lede:'Um roteiro completo e testado, do primeiro “oi” até o fechamento. No fim, um checklist para você nunca mais pular uma etapa.',
   chips:['Velocidade é venda','Perguntas antes da referência','Desejo antes do preço','Fechar ou negociar']},
  {t:'module', n:'Módulo 1', time:'2–7 min', title:'Início do Atendimento',
   points:[
     {t:'Velocidade de resposta é venda',d:'Cliente manda pra mais de um tatuador. Quem responde rápido sai na frente antes do preço.'},
     {t:'Responda em até 1 minuto',d:'Não conseguiu? Responda o quanto antes. O importante é não deixar esfriar.'},
     {t:'Apresente-se e pergunte o nome',d:'Se o nome não aparecer no WhatsApp, pergunte logo.'},
     {t:'Chame pelo nome sempre',d:'A partir daqui, em toda mensagem.'}],
   demo:{who:'Você', text:'Oi! Tudo bem? Aqui é o [Nome], tatuador. Vi sua mensagem agora, que bom que você chegou até mim! Com quem eu falo?'},
   note:{k:'warn', tag:'Erro comum', text:'Responder só “oi, pode falar” soa frio, como robô de SAC. Queremos parecer humanos, não um atendimento de loja.'}},
  {t:'module', n:'Módulo 2', time:'7–14 min', title:'Entender o Cliente',
   points:[
     {t:'É a primeira tatuagem?',d:'Entenda o nível de familiaridade.'},
     {t:'Onde vai ser feita?',d:'Localização no corpo muda tudo.'},
     {t:'Qual o tamanho aproximado?',d:'Define escopo e investimento.'},
     {t:'Já tem referência?',d:'Quase no fim, de propósito.'},
     {t:'Tem significado ou é estética?',d:'Conecta você à pessoa, não à imagem.'}],
   demo:{who:'Você', text:'[Nome], é sua primeira tatuagem ou você já tem outras? E já pensou em qual parte do corpo?'},
   note:{k:'good', tag:'Por que a ordem importa', text:'Se você pede a referência cedo demais, a conversa vira só sobre imagem e você perde a chance de entender o cliente como pessoa.'}},
  {t:'module', n:'Módulo 3', time:'14–20 min', title:'Gerar Valor',
   points:[
     {t:'Desejo antes do preço',d:'Cliente compra a transformação, não a tatuagem.'},
     {t:'Elogie a referência',d:'Valorize o que ele trouxe.'},
     {t:'Mostre que é sua especialidade',d:'Aquele estilo é exatamente o que você domina.'},
     {t:'Projete o resultado',d:'Faça ele se imaginar com a tattoo pronta.'}],
   demo:{who:'Você', text:'Cara, que referência boa! Esse estilo é exatamente o que eu mais gosto de fazer. Tenho certeza de que você vai amar o resultado final.'},
   note:{k:'good', tag:'Guarde essa frase', text:'“Tenho certeza de que você vai amar.” Planta expectativa positiva antes de falar de valores.'}},
  {t:'module', n:'Módulo 4', time:'20–26 min', title:'Explicar o Processo',
   points:[
     {t:'Como funciona seu processo criativo',d:'Transparência tira o medo do permanente.'},
     {t:'Arte construída junto',d:'A arte nasce do que ele te passou.'},
     {t:'Só tatua após 100% de aprovação',d:'Sem ansiedade. O desenho é aprovado antes da agulha.'},
     {t:'Garanta o encaixe perfeito',d:'No corpo dele, não genérico.'}],
   demo:{who:'Você', text:'Deixa eu te explicar rapidinho. Eu crio a arte com base no que você me passou, e você só vai pra cadeira depois de aprovar o desenho.'},
   note:{k:'good', tag:'Justificando o preço', text:'Você não vende uma hora de agulha. Você vende um processo. Por isso seu preço não precisa ser o mais barato do mercado.'}},
  {t:'module', n:'Módulo 5', time:'26–29 min', title:'Eliminar Dúvidas',
   points:[
     {t:'Feche as portas de dúvida',d:'Antes de falar de dinheiro.'},
     {t:'Dúvida não respondida vira desculpa',d:'Na hora do preço, ela aparece.'},
     {t:'A ponte para o orçamento',d:'Sem parecer que tem pressa de falar de preço.'}],
   demo:{who:'Você', text:'Antes de te passar os valores, ficou alguma dúvida sobre como funciona o meu processo?'},
   note:{k:'good', tag:'Por que funciona', text:'Fecha o assunto anterior e abre o caminho pro orçamento de um jeito natural.'}},
  {t:'module', n:'Módulo 6', time:'29–36 min', title:'Apresentar o Orçamento',
   points:[
     {t:'Nunca envie o preço antes dessa etapa',d:'Senão o cliente compara sem entender seu valor.'},
     {t:'Valor à vista',d:'Informe primeiro.'},
     {t:'Opção parcelada (até 6x)',d:'Depois do à vista.'},
     {t:'“Como fica pra você?”',d:'E então: silêncio.'}],
   demo:{who:'Você', text:'Então, [Nome], pelo que você me passou, o valor à vista fica R$ [valor]. Também dá pra parcelar em até 6x. Como fica pra você?'},
   note:{k:'warn', tag:'Regra de ouro', text:'Depois dessa pergunta, você se cala. Quem fala primeiro depois do preço perde força de negociação.'}},
  {t:'module', n:'Módulo 7', time:'36–40 min', title:'Se o Cliente Fechar',
   points:[
     {t:'Solicite o sinal',d:'Garante o compromisso.'},
     {t:'Sinal é descontado do total',d:'Deixe claro desde já.'},
     {t:'Agende data e confirme horário',d:'Fechado, dia X às Y.'},
     {t:'Confirme endereço e agradeça',d:'Encerre redondo.'}],
   demo:{who:'Você', text:'Perfeito! Pra garantir sua vaga, peço um sinal de R$ [valor], descontado do total. Qual data funciona melhor pra você?'},
   note:{k:'good', tag:'O atendimento não acabou', text:'Fechou? Ótimo! Agora é garantir o compromisso e deixar tudo redondo.'}},
  {t:'module', n:'Módulo 8', time:'40–47 min', title:'Se o Cliente Não Fechar',
   points:[
     {t:'Descubra o motivo',d:'Hesitação tem uma causa. Descubra qual é.'},
     {t:'“Qual valor você imaginava investir?”',d:'Tire a adivinhação da mesa.'},
     {t:'Negocie só se necessário',d:'E só durante aquele atendimento.'},
     {t:'Desconto = contrapartida',d:'Nunca dê de graça.'}],
   demo:{who:'Você', text:'Se você fechar comigo agora, consigo fazer por R$ 1.990 em vez de R$ 2.490. Só te peço uma postagem me marcando no Instagram. Topa?'},
   note:{k:'good', tag:'Estrutura da negociação', text:'Elogio + justificativa (portfólio) + desconto + contrapartida + pergunta de fechamento.'}},
  {t:'module', n:'Módulo 9', time:'47–51 min', title:'O Que Evitar',
   points:[
     {t:'Preço antes da hora certa',d:'Desfaz todo o valor construído.'},
     {t:'Insegurança',d:'“Talvez”, “pode ser”, “quem sabe”, “depende”.'},
     {t:'Texto gigante',d:'Quando um áudio resolveria melhor.'},
     {t:'Deixar o cliente esperando',d:'Sem retorno, sem venda.'}],
   note:{k:'warn', tag:'Atenção', text:'Essas palavras parecem inofensivas, mas plantam dúvida. Se você não tem certeza, o cliente também não vai ter.'}},
  {t:'module', n:'Módulo 10', time:'51–55 min', title:'Boas Práticas',
   points:[
     {t:'Priorize áudio',d:'Sempre que der, humaniza.'},
     {t:'Entusiasmo de verdade',d:'Energia transmite confiança.'},
     {t:'Faça o cliente imaginar pronta',d:'A transformação na mente dele.'},
     {t:'Conduza até uma decisão',d:'Nunca deixe morrer no “vou pensar”.'}],
   demo:{who:'Lembrete', text:'Chame o cliente pelo nome várias vezes. Mantenha o atendimento leve, natural e acolhedor.'},
   note:{k:'good', tag:'Do início ao fim', text:'Todo atendimento termina com uma decisão: fechar ou negociar. Não deixe a conversa morrer no vazio.'}},
  {t:'checklist', n:'Encerramento', time:'55–60 min', title:'Checklist Final',
   checks:['Entendi o que o cliente deseja?','Expliquei meu processo?','Tirei todas as dúvidas?','Apresentei o orçamento corretamente?','Fiz a pergunta de fechamento?','Negociei se necessário?','Agendei ou deixei próxima ação?','Chamei pelo nome e fui acolhedor?'],
   note:{k:'good', tag:'Não é sorte, é processo', text:'Seguindo esse roteiro em todo atendimento, sua taxa de fechamento muda de patamar. Todo “oi” vira uma venda conduzida.'}}
];

const deck = document.getElementById('deck');
function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }

function renderSlide(s){
  const sec = el('section','slide');
  const inner = el('div','inner');
  if(s.t==='title'){
    inner.appendChild(el('div','eyebrow',''+s.eyebrow));
    const h = el('h1','title',s.title); inner.appendChild(h);
    inner.appendChild(el('p','lede',s.lede));
    const chips = el('div','chips');
    s.chips.forEach(c=>chips.appendChild(el('span','chip','<b>◆</b>&nbsp; '+c)));
    inner.appendChild(chips);
  } else if(s.t==='module'){
    const head = el('div','mod-head');
    head.appendChild(el('span','mod-num',s.n));
    head.appendChild(el('span','mod-time',s.time));
    inner.appendChild(head);
    inner.appendChild(el('h2','mod-title',s.title));
    const pts = el('div','points');
    s.points.forEach((p,i)=>pts.appendChild(el('div','point','<span class="d">'+(String(i+1).padStart(2,'0'))+'</span><div><strong>'+p.t+'</strong><span>'+p.d+'</span></div>')));
    inner.appendChild(pts);
    const split = el('div','split');
    const demo = el('div','demo'); demo.appendChild(el('span','tag','Demonstração')); const b=el('div','bubble'); b.appendChild(el('span','who',s.demo.who)); b.appendChild(document.createTextNode(s.demo.text)); demo.appendChild(b);
    split.appendChild(demo);
    const note = el('div','note '+(s.note.k)); note.appendChild(el('span','tag',s.note.tag)); note.appendChild(el('p','',s.note.text));
    split.appendChild(note);
    inner.appendChild(split);
  } else if(s.t==='checklist'){
    const head = el('div','mod-head');
    head.appendChild(el('span','mod-num',s.n));
    head.appendChild(el('span','mod-time',s.time));
    inner.appendChild(head);
    inner.appendChild(el('h2','mod-title',s.title));
    const checks = el('div','checks');
    s.checks.forEach(c=>checks.appendChild(el('div','check','<span class="box"></span><span>'+c+'</span>')));
    inner.appendChild(checks);
    const note = el('div','note good'); note.style.marginTop='34px'; note.style.maxWidth='820px'; note.appendChild(el('span','tag',s.note.tag)); note.appendChild(el('p','',s.note.text));
    inner.appendChild(note);
  }
  sec.appendChild(inner);
  return sec;
}
SLIDES.forEach(s=>deck.appendChild(renderSlide(s)));

let i=0; const slides=[...document.querySelectorAll('.slide')];
function go(n){ i=Math.max(0,Math.min(slides.length-1,n)); update(); }
function update(){
  slides.forEach((s,idx)=>s.classList.toggle('active',idx===i));
  document.getElementById('bar').style.width=((i)/(slides.length-1)*100)+'%';
  document.getElementById('count').textContent=String(i+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
}
document.addEventListener('keydown',e=>{
  if(['ArrowRight',' ','PageDown'].includes(e.key))go(i+1);
  if(['ArrowLeft','PageUp'].includes(e.key))go(i-1);
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
update();
</script>
</body>
</html>
